name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify the skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash
          # --upgrade and NOT --quiet: the runner image already carries a
          # jsonschema, so a plain install is a silent no-op and the schema
          # rows then run against whatever version the image happened to ship.
          # The version is printed so a drift is visible in the log rather than
          # inferred from a failure.
          python3 -m pip install --upgrade jsonschema
          python3 -c 'import importlib.metadata as m; print("jsonschema", m.version("jsonschema"))'

      # The runtime half of the suite - the provider, the copy verification, the
      # generated read, the anonymous-volume ledger - runs real containers off
      # this image. Pulled explicitly so a rate-limited or renamed image is a
      # failing step here rather than nine quiet skips further down.
      - name: Pull the image the runtime rows launch
        run: docker pull alpine/git

      # STACKGRAFT_REQUIRE_RUNTIME turns a missing daemon, image or interpreter
      # into a failure instead of a note. Without it this job ran 565 of 805
      # rows on a runner with no daemon and printed `all checks passed` - the
      # mechanism this release exists for, with no executed coverage and no way
      # for CI to say so.
      - name: Run the verification suite
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/verify.sh

  integration:
    name: the seeded-copy road against a real store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A real store image, booted by its own entrypoint. Every other runtime
      # row in this repository runs `--entrypoint sh` against alpine/git, which
      # is what kept an image's boot requirements invisible: the shipped empty-
      # instance recipe passed no environment, postgres exited 1 before any
      # query could be issued, and no prose row could notice because the prose
      # said what the prose said.
      - name: Pull the store images the floor boots
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7

      - name: Drive the copy road end to end
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration.sh

  overlay:
    name: the overlay run against a real repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The copy road is one segment of ten steps. This job drives the rest of
      # them -- a real repository, a real worktree, the skill's own pick-port,
      # an overlay wired to the copy, and the claim the whole skill exists for:
      # that the base store is provably untouched afterwards.
      - name: Pull the store images the run boots
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7

      - name: Drive the overlay run end to end
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-overlay.sh

  discovery:
    name: discovery and the manifest it produces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The schema rows validate manifests written by hand to be validated. No
      # manifest discovery actually produced had ever been checked against the
      # schema this repository ships, so this job asks that of a real answer --
      # and reproduces the serviceFingerprint recipe, whose four claims were
      # verified once on a scratch repository and never again.
      - name: Install the validator
        run: python3 -m pip install --upgrade jsonschema

      - name: Pull the store images the resolver reports
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7

      - name: Drive discovery and validate what it produces
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-discovery.sh

  family:
    name: the generated lifecycle family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The copy road is proved GIVEN a read command, and the fixture ships one
      # by hand as though a run had offered it and a human had approved it. The
      # flow that produces that file had no floor, and on a repository with no
      # rung-1 candidate it is not optional: without it no copy is ever
      # certified.
      - name: Pull the store images the family runs against
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7

      - name: Drive the offer, the approval and the two falsifiers
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-family.sh

  parallel:
    name: two worktrees at once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The claim this skill is named for, and the one every other floor leaves
      # untested by running exactly one worktree: two features on the same
      # service, each with its own data, and one teardown that does not eat the
      # other's.
      - name: Pull the store images the run boots
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7

      - name: Drive two worktrees against one base stack
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-parallel.sh

  zerodisk:
    name: the zero-disk road
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every other floor takes the copy road, because no fixture defines a
      # database lifecycle target. This one builds the repository that does, so
      # the pair reaches step 4 instead of step 5 -- a namespace inside the
      # instance already running, no volume and no second container.
      - name: Pull the store images the run boots
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7

      - name: Drive the in-instance road end to end
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-zerodisk.sh

  agenttrial:
    name: the agent-trial harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The trial itself needs a model and is human-invoked. Whether the
      # harness around it still works does not -- and a trial nobody can set up
      # is a trial nobody runs. This asserts setup, a clean check, that the
      # check can fail, and that teardown leaves nothing.
      - name: Pull the store images the subject boots
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7

      - name: Set up, check, and tear down a trial with no agent in it
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/agent-trial-smoke.sh

  theft:
    name: theft, the other hazard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Seven floors exercise contamination -- the overlay writing state the base
      # reads. X came back `no` in all of them, so step 2 of the verdict table,
      # competesOn and the whole identity proof were never executed. A consumer
      # group is where the damage is observable: same group and the stream is
      # split, distinct group and both see everything.
      - name: Pull the store images the run boots
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7

      - name: Drive a competing pair end to end
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-theft.sh

  reaping:
    name: the mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The only code here that stops and removes objects on a developer's
      # machine. Every other floor reads, copies or launches; a mistake there is
      # a wrong answer, and a mistake here takes something off the machine.
      - name: Pull the store images the run boots
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7
      - name: Drive the actuator, negatives first
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-reaping.sh

  noquery:
    name: no query, what a real first run gets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every copy-road floor is handed a rung-2 source because the fixture ships
      # one. A real repository ships none, so the outcome most repositories meet
      # on their first run -- bytes copied, no query derivable, copy destroyed,
      # pair refused -- had never been driven.
      - name: Pull the store images the run boots
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mysql:8.4
          docker pull mongo:7
      - name: Drive the refusal a first run actually reaches
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-noquery.sh

  unadvised:
    name: an engine the skill never names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The four engines the other floors drive are four engines someone chose,
      # and a procedure tuned to them passes every one of those jobs. This job
      # drives a store whose engine appears in no document in the skill -- it
      # checks that first and aborts if any of them has learned the word -- so
      # what it exercises is the procedure rather than accumulated advice.
      - name: Pull an engine no document in the skill names
        run: docker pull couchdb:3
      - name: Drive the whole copy road against it
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-unadvised.sh

  staleness:
    name: does the overlay run the worktree code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every other floor launches a unit that reads its source at run time, so
      # this question never arose. Most repositories bake it into an image, and
      # the run form the documents derive an overlayCommand from reuses the tag
      # already there -- built from the MAIN checkout. This drives both halves:
      # that the bare form serves stale code, and that the rule replacing it
      # serves the worktree's without moving the base project's own image.
      - name: Pull the images the subject builds from
        run: docker pull alpine:latest
      - name: Drive it
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-staleness.sh

  drivability:
    name: are the documents drivable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No store image and no runtime: this job asks whether everything the
      # documents tell an agent to reach exists and behaves as written. It is
      # the necessary condition under "an agent can drive this", and the only
      # half of it that is testable without a model in the loop.
      - name: Check the documents against what they point at
        run: sh .github/scripts/integration-drivability.sh

  portability:
    name: scripts run on a minimal image
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Install the skill's actual dependencies, and nothing else
        run: apk add --no-cache git dash

      - uses: actions/checkout@v4

      - name: The helpers must work with only git, sh and awk
        run: |
          set -eu
          cd skills/stackgraft/scripts
          dash -n pick-port.sh
          dash -n fingerprint.sh

          wt=$(mktemp -d)
          port=$(sh pick-port.sh 18000 18999 "$wt")
          case $port in 1[89][0-9][0-9][0-9]) ;; *) echo "bad port: $port"; exit 1 ;; esac
          echo "candidate port: $port"

          # busybox awk, busybox sh, no coreutils, no bash - the point of the job
          printf 'pick-port.sh\nfingerprint.sh' | sh fingerprint.sh -

          echo "helpers run on alpine with git, dash and busybox awk only"

  macos-sh:
    name: scripts parse under the sh macOS actually has
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # /bin/sh on macOS is bash 3.2, and its parser cannot read a `case`
      # pattern inside $( ) -- it counts the pattern's own `)` as the
      # substitution's close. dash and bash 5 accept that shape, so every other
      # job in this file passes a script no macOS user can run. This job is the
      # shell itself rather than a lint for the shapes we happen to know about.
      - name: Report the shell this job actually gets
        run: |
          /bin/sh -c 'echo "sh is bash ${BASH_VERSION:-not bash}"'

      - name: Every shipped script, and every check that drives them
        run: |
          set -eu
          for f in skills/stackgraft/scripts/*.sh .github/scripts/*.sh; do
              /bin/sh -n "$f" || { echo "does not parse under macOS /bin/sh: $f"; exit 1; }
          done
          echo "all shipped scripts and all floors parse under bash ${BASH_VERSION:-?}"

      - name: And the helpers run, not just parse
        run: |
          set -eu
          cd skills/stackgraft/scripts
          wt=$(mktemp -d)
          port=$(/bin/sh pick-port.sh 18000 18999 "$wt")
          case $port in 1[89][0-9][0-9][0-9]) ;; *) echo "bad port: $port"; exit 1 ;; esac
          excl=$(/bin/sh pick-port.sh 18000 18999 "$wt" "$port")
          [ "$excl" != "$port" ] || { echo "exclusion ignored"; exit 1; }
          printf 'pick-port.sh\nfingerprint.sh' | /bin/sh fingerprint.sh -
          echo "helpers run under macOS /bin/sh: candidate $port, exclusions honoured"

  git-bash:
    name: helpers run under Git Bash on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Report the environment the scripts actually get
        run: |
          uname -a
          git --version
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1

      - name: The helpers must survive MSYS path translation
        run: |
          set -eu
          cd skills/stackgraft/scripts

          sh -n pick-port.sh
          sh -n fingerprint.sh

          wt=$(mktemp -d)
          port=$(sh pick-port.sh 18000 18999 "$wt")
          case $port in 1[89][0-9][0-9][0-9]) ;; *) echo "bad port: $port"; exit 1 ;; esac

          # MSYS rewrites arguments that look like POSIX paths. If that mangles
          # the worktree argument, the offset changes and these disagree.
          a=$(sh pick-port.sh 18000 18999 "$wt")
          b=$(sh pick-port.sh 18000 18999 "$wt/")
          [ "$a" = "$b" ] || { echo "path spelling changed the port: $a vs $b"; exit 1; }

          excl=$(sh pick-port.sh 18000 18999 "$wt" "$a")
          [ "$excl" != "$a" ] || { echo "exclusion ignored"; exit 1; }

          # -C is the argument most exposed to path translation.
          cd ../../..
          out=$(sh skills/stackgraft/scripts/fingerprint.sh -C skills/stackgraft SKILL.md)
          case $out in *"	SKILL.md") ;; *) echo "unexpected: $out"; exit 1 ;; esac

          echo "helpers work under Git Bash: candidate $port, -C resolved, exclusions honoured"
