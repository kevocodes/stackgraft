# The subject the suite has never had: a real store, booted by its own image's
# entrypoint, holding data an empty instance of that image does not.
#
# Three properties make it the ordinary case rather than a friendly one:
#   - the store's healthcheck is CMD-SHELL, so it is shell source and the argv
#     rule excludes it as a rung-1 candidate;
#   - the repository defines no database lifecycle target, so rung 1 has no
#     create or drop either;
#   - scripts/ already exists, so a generated family has a home that is not a
#     convention this skill invented.
name: sg-fixture-shopdemo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - shop-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Loopback-only, deliberately: `bindsTo` is read from this spec, and the two
    # forms below have to be told apart. `127.0.0.1:15432:5432` binds loopback;
    # catalog-api's bare form binds every interface.
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A second engine, and deliberately one that differs from the first in every
  # way the procedure is supposed to be blind to: it needs no environment to
  # boot, its healthcheck IS an exec-form vector -- so it is a rung-1 candidate
  # where postgres never gets that far -- and it still supplies no query,
  # because `redis-cli ping` answers PONG on an instance holding nothing.
  sessions:
    image: redis:7-alpine
    # It seeds itself on first boot, because a store that ships empty cannot be
    # told from an empty instance: its read candidate answers zero on both, and
    # the discriminator it exists to satisfy has nothing to read.
    command:
      - sh
      - -c
      - >
        redis-server --save 60 1 --appendonly no &
        until redis-cli ping >/dev/null 2>&1; do sleep 0.2; done;
        [ "$$(redis-cli DBSIZE)" -eq 0 ] &&
        for k in a b c d e f g; do redis-cli SET "session:$$k" "value-$$k" >/dev/null; done;
        redis-cli SAVE >/dev/null; wait
    volumes:
      - sessions-data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A third engine, and a second that refuses to boot without environment --
  # so the environment read-back is not a postgres accommodation. Its
  # healthcheck IS an exec-form vector, like the session store's, and answers
  # the same on an instance holding nothing, so it reaches the discriminator
  # with a candidate in hand and is refused there rather than by the argv rule.
  orders-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: shop
      MYSQL_DATABASE: shop
    volumes:
      - orders-data:/var/lib/mysql
      - ./db/orders.sql:/docker-entrypoint-initdb.d/orders.sql:ro
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pshop"]
      interval: 5s
      timeout: 5s
      retries: 40

  # A fourth, and a document store rather than a relational one: a different
  # data model, a different client, and nothing in the procedure that reads it
  # changes. It needs no environment to boot, like the session store.
  catalog-docs:
    image: mongo:7
    volumes:
      - docs-data:/data/db
      - ./db/docs.js:/docker-entrypoint-initdb.d/docs.js:ro
    ports:
      - "127.0.0.1:17017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  catalog-api:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Written so a value from the calling environment wins, which is the
      # one line that gives an overlay a channel to an isolated copy. A
      # literal here has none, and the gate refuses that pair rather than
      # pointing the overlay at the base store.
      DATABASE_URL: ${DATABASE_URL:-postgres://shop:shop@postgres:5432/shop}
    volumes:
      - ./services/catalog-api:/app:ro
      # Only the migrations this service applies, not the whole db tree: the
      # initdb seeds beside them belong to the stores, and mounting them here
      # would put three other stores' files inside this unit's own paths.
      - ./db/migrations:/db/migrations:ro
    command: ["sh", "/app/serve.sh"]
    ports:
      - "18080:8080"

volumes:
  shop-data:
  sessions-data:
  orders-data:
  docs-data:
