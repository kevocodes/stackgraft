name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: publish the tagged release
    runs-on: ubuntu-latest

    # A job-level block sets every scope it does not list to none, so this is
    # the whole of what the token can do: create a release. Nothing here reads
    # an issue, writes a package, or touches an action.
    permissions:
      contents: write

    # POSIX sh, the same constraint the scripts are held to. On ubuntu that is
    # dash, so a bashism in a step fails here rather than in a user's shell.
    defaults:
      run:
        shell: sh

    steps:
      - uses: actions/checkout@v4

      # The one correspondence a machine can actually check. It cannot know
      # whether 1.2.0 is the right number for what shipped - that stays a human
      # judgement - but it can know that the tag and the manifest disagree, and
      # a disagreement means an installed user receives a version that is not
      # the one being announced.
      #
      # plugin.json is the source of truth. The other three places are compared
      # to it by the `release version` section of verify.sh on every push and
      # pull request, so by the time a tag exists their agreement is settled and
      # this step has one comparison left to make.
      - name: The tag must agree with the manifests
        id: version
        run: |
          set -eu
          tagged=${GITHUB_REF_NAME#v}
          declared=$(awk '
              found { next }
              match($0, /"version"[ \t]*:[ \t]*"[^"]*"/) {
                  s = substr($0, RSTART, RLENGTH)
                  match(s, /"[^"]*"$/)
                  print substr(s, RSTART + 1, RLENGTH - 2)
                  found = 1
              }
              END { if (!found) print "absent" }
          ' .claude-plugin/plugin.json)

          if [ "$tagged" != "$declared" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} carries ${tagged}, .claude-plugin/plugin.json declares ${declared}"
              echo "The tag and the manifests must carry one number. Nothing was published."
              exit 1
          fi

          echo "tag ${GITHUB_REF_NAME} agrees with plugin.json (${declared})"
          echo "version=${tagged}" >> "$GITHUB_OUTPUT"

      # The release body is the CHANGELOG section and nothing else, so what the
      # repository says about a version and what the releases page says about it
      # are one artifact. A tag with no entry is refused here rather than
      # published with an empty body.
      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if ! sh .github/scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"; then
              echo "::error::CHANGELOG.md has no usable entry for ${VERSION}. Nothing was published."
              exit 1
          fi
          echo "--- release notes ---"
          cat "$RUNNER_TEMP/notes.md"

      # The title is the tag, because the notes no longer repeat the version:
      # GitHub renders the title above the body and the tag beside it, so a
      # heading in the body would say the same thing a third time.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
