# openspec/config.yaml
schema: spec-driven

project: stackgraft

context: |
  Product: a portable Agent Skill (agentskills.io standard) that starts only the
  services a git worktree changed, on alternate ports, re-wiring unchanged
  dependencies to the already-running base stack.
  Stack: no programming language committed. Repo is Markdown + JSON only.
  Deliverable shape: skills/stackgraft/{SKILL.md, assets/, references/, scripts/}.
  Portability: must work for ~40 agents; no single-agent paths or conventions.
  Testing: no test runner in repo. Verification is manual review + JSON parse.
  Artifacts language: English.

artifact_store: openspec
execution_mode: interactive
delivery_strategy: ask-on-risk
review_budget_lines: 400

testing:
  strict_tdd: false
  strict_tdd_reason: >-
    No test runner, no language runtime, and no CI are committed to this repo.
    Declaring strict TDD would assert a capability that does not exist.
  test_runner: ""
  test_command: ""
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: ""
    type_checker: ""
    formatter: ""
  available_verification:
    - "Human/agent review of SKILL.md against the LLM-first skill style guide."
    - "JSON well-formedness and JSON Schema validity of assets/*.json."
    - "Cross-file consistency: every field named in SKILL.md and references/ exists in assets/manifest.schema.json."
    - "Portability grep: no agent-specific path or tool name in shipped files."
    - "POSIX syntax check: dash -n on every skills/stackgraft/scripts/*.sh, plus one command -v per name for git and awk on macOS and a minimal Linux image (busybox command -v reports only its first argument, so never pass several names at once)."
    - "Lock and compare-and-swap fixtures: a serialised A/B pair against one destination, an abandoned lock whose owner names a dead pid, an owner naming a live pid with its true lstart, a lock with no owner file, a lock created during the wait, and TERM against KILL on a holder. Every one asserts the destination's bytes as well as the exit status, because a refusal that also wrote is not a refusal."
    - "Budget counters run as named commands, never by eye: body words with awk 'f{n+=NF} /^---$/{c++; if(c==2) f=1} END{print n}' and compatibility bytes with awk -F'\"' '/^compatibility:/{print length($2)}'. Each carries negative fixtures — an over-ceiling body, and an absent, unquoted, or embedded-quote compatibility value — because a counter that cannot report a failure measures nothing."
    - "Two sibling repositories on one host: the stackgraft.repo=<hash8> filtered query returns only its own overlay, and the same query unfiltered returns both, which is what proves the filter and not the working directory is doing the scoping."
    - "A stub ps earlier on PATH: one that honours -p proves the start-time probe reports supported, and one that ignores -p and prints several lines proves it reports unsupported."
    - "Real execution of every script on macOS and on a minimal Linux image (docker run --rm -v \"$PWD\":/w -w /w alpine/git), in addition to the parse check, so a GNU-only flag that parses cleanly still fails where it is not shipped."

rules:
  proposal:
    - "State which agentskills.io contract surface the change touches (SKILL.md body, assets/, references/, scripts/)."
    - "Include a rollback plan. The skill is copy-a-folder, so rollback is reverting the folder; state any manifest-schema migration explicitly."
  specs:
    - "Use Given/When/Then for scenarios."
    - "Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)."
    - "Requirements about the skill body MUST be observable by reading the shipped files, not by running an agent."
  design:
    - "Justify any new file against the agentskills.io folder contract."
    - "Document portability impact for non-Claude agents explicitly."
    - "Record the chosen scripts/ runtime and why it needs no install step."
  tasks:
    - "Group by phase, use hierarchical numbering."
    - "Keep tasks completable in one session."
    - "Keep SKILL.md body edits in their own task; the body has a token budget."
  apply:
    guidelines:
      - "Follow the LLM-first skill style guide section order: frontmatter, Activation Contract, Hard Rules, Decision Gates, Execution Steps, Output Contract, References."
      - "Keep SKILL.md body within 180-450 tokens; recommended max 700, hard max 1000. Move detail to references/ or assets/."
      - "description MUST be one physical quoted line, trigger words first, at most 250 chars."
      - "Ship no path, env var, or tool name that only one agent provides."
      - "All artifacts, docs, comments, and identifiers in English."
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
    manual_checks:
      - "Every references/ and assets/ link in SKILL.md resolves relative to the skill directory."
      - "assets/manifest.example.json validates against assets/manifest.schema.json."
      - "No agent-specific coupling introduced in shipped files."
  archive:
    - "Warn before merging destructive deltas."
    - "Merge delta specs into openspec/specs/ before moving the change folder."

open_decisions:
  - id: scripts-runtime
    status: resolved
    do_not_decide_in: ["sdd-init"]
    question: >-
      Which language implements the deterministic helper under
      skills/stackgraft/scripts/?
    constraint: >-
      It MUST run with no install step on both macOS and Linux, because
      adopting the skill has to stay "copy a folder". No package manager
      step, no build step, no runtime the user must add.
    decision: >-
      POSIX sh with git and POSIX awk, invoked as `sh scripts/<name>.sh` so
      that neither the executable bit nor the shebang is load-bearing (design
      DS19). All three ship with a stock macOS and a minimal Linux image, so
      adoption stays "copy a folder".
    notes: >-
      python3 is a stub on stock macOS, and jq, node, and sha256sum are absent
      from minimal Linux images. So the helpers never touch JSON — the agent
      owns the manifest file — hashing borrows git, and glob matching stays
      with the agent.
