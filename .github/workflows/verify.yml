name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify the skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash
          # --upgrade and NOT --quiet: the runner image already carries a
          # jsonschema, so a plain install is a silent no-op and the schema
          # rows then run against whatever version the image happened to ship.
          # The version is printed so a drift is visible in the log rather than
          # inferred from a failure.
          python3 -m pip install --upgrade jsonschema
          python3 -c 'import importlib.metadata as m; print("jsonschema", m.version("jsonschema"))'

      # The runtime half of the suite - the provider, the copy verification, the
      # generated read, the anonymous-volume ledger - runs real containers off
      # this image. Pulled explicitly so a rate-limited or renamed image is a
      # failing step here rather than nine quiet skips further down.
      - name: Pull the image the runtime rows launch
        run: docker pull alpine/git

      # STACKGRAFT_REQUIRE_RUNTIME turns a missing daemon, image or interpreter
      # into a failure instead of a note. Without it this job ran 565 of 805
      # rows on a runner with no daemon and printed `all checks passed` - the
      # mechanism this release exists for, with no executed coverage and no way
      # for CI to say so.
      - name: Run the verification suite
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/verify.sh

  integration:
    name: the seeded-copy road against a real store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A real store image, booted by its own entrypoint. Every other runtime
      # row in this repository runs `--entrypoint sh` against alpine/git, which
      # is what kept an image's boot requirements invisible: the shipped empty-
      # instance recipe passed no environment, postgres exited 1 before any
      # query could be issued, and no prose row could notice because the prose
      # said what the prose said.
      - name: Pull the store image the floor boots
        run: docker pull postgres:16-alpine

      - name: Drive the copy road end to end
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration.sh

  overlay:
    name: the overlay run against a real repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The copy road is one segment of ten steps. This job drives the rest of
      # them -- a real repository, a real worktree, the skill's own pick-port,
      # an overlay wired to the copy, and the claim the whole skill exists for:
      # that the base store is provably untouched afterwards.
      - name: Pull the store image the run boots
        run: docker pull postgres:16-alpine

      - name: Drive the overlay run end to end
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-overlay.sh

  discovery:
    name: discovery and the manifest it produces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The schema rows validate manifests written by hand to be validated. No
      # manifest discovery actually produced had ever been checked against the
      # schema this repository ships, so this job asks that of a real answer --
      # and reproduces the serviceFingerprint recipe, whose four claims were
      # verified once on a scratch repository and never again.
      - name: Install the validator
        run: python3 -m pip install --upgrade jsonschema

      - name: Pull the store image the resolver reports
        run: docker pull postgres:16-alpine

      - name: Drive discovery and validate what it produces
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-discovery.sh

  family:
    name: the generated lifecycle family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The copy road is proved GIVEN a read command, and the fixture ships one
      # by hand as though a run had offered it and a human had approved it. The
      # flow that produces that file had no floor, and on a repository with no
      # rung-1 candidate it is not optional: without it no copy is ever
      # certified.
      - name: Pull the store image the family runs against
        run: docker pull postgres:16-alpine

      - name: Drive the offer, the approval and the two falsifiers
        env:
          STACKGRAFT_REQUIRE_RUNTIME: '1'
        run: sh .github/scripts/integration-family.sh

  portability:
    name: scripts run on a minimal image
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Install the skill's actual dependencies, and nothing else
        run: apk add --no-cache git dash

      - uses: actions/checkout@v4

      - name: The helpers must work with only git, sh and awk
        run: |
          set -eu
          cd skills/stackgraft/scripts
          dash -n pick-port.sh
          dash -n fingerprint.sh

          wt=$(mktemp -d)
          port=$(sh pick-port.sh 18000 18999 "$wt")
          case $port in 1[89][0-9][0-9][0-9]) ;; *) echo "bad port: $port"; exit 1 ;; esac
          echo "candidate port: $port"

          # busybox awk, busybox sh, no coreutils, no bash - the point of the job
          printf 'pick-port.sh\nfingerprint.sh' | sh fingerprint.sh -

          echo "helpers run on alpine with git, dash and busybox awk only"

  git-bash:
    name: helpers run under Git Bash on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Report the environment the scripts actually get
        run: |
          uname -a
          git --version
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1

      - name: The helpers must survive MSYS path translation
        run: |
          set -eu
          cd skills/stackgraft/scripts

          sh -n pick-port.sh
          sh -n fingerprint.sh

          wt=$(mktemp -d)
          port=$(sh pick-port.sh 18000 18999 "$wt")
          case $port in 1[89][0-9][0-9][0-9]) ;; *) echo "bad port: $port"; exit 1 ;; esac

          # MSYS rewrites arguments that look like POSIX paths. If that mangles
          # the worktree argument, the offset changes and these disagree.
          a=$(sh pick-port.sh 18000 18999 "$wt")
          b=$(sh pick-port.sh 18000 18999 "$wt/")
          [ "$a" = "$b" ] || { echo "path spelling changed the port: $a vs $b"; exit 1; }

          excl=$(sh pick-port.sh 18000 18999 "$wt" "$a")
          [ "$excl" != "$a" ] || { echo "exclusion ignored"; exit 1; }

          # -C is the argument most exposed to path translation.
          cd ../../..
          out=$(sh skills/stackgraft/scripts/fingerprint.sh -C skills/stackgraft SKILL.md)
          case $out in *"	SKILL.md") ;; *) echo "unexpected: $out"; exit 1 ;; esac

          echo "helpers work under Git Bash: candidate $port, -C resolved, exclusions honoured"
